[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pooldeal"
version = "0.1.0"
description = "Signed cross-session contribution obligations with Sibyl Memory"
requires-python = ">=3.10"
dependencies = [
  "eth-account>=0.13,<0.14",
  "flask>=3.1,<4",
  "gunicorn>=23,<24",
  "sibyl-memory-client==0.8.0",
  "web3>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
pooldeal = "pooldeal.cli:main"
pooldeal-web = "pooldeal.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pooldeal = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
